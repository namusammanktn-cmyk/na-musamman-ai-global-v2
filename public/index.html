<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NA MUSAMMAN AI GLOBAL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #06152e;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(
        135deg,
        #071d42,
        #003b73
      );

      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #168cff;
    }

    header h1 {
      font-size: 21px;
      color: #ffffff;
    }

    header p {
      margin-top: 4px;
      font-size: 12px;
      color: #7fdcff;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 80px;
      opacity: 0.9;
    }

    .welcome h2 {
      font-size: 25px;
      color: #50cfff;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #c7d9ef;
      font-size: 14px;
    }

    .message {
      display: flex;
      margin: 10px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
    }

    .user .bubble {
      background: #087ee8;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: #10294d;
      border: 1px solid #214a77;
      border-bottom-left-radius: 4px;
    }

    .message img {
      max-width: 230px;
      border-radius: 12px;
      margin-top: 7px;
      display: block;
    }

    .input-area {
      background: #071a35;
      border-top: 1px solid #163b62;
      padding: 10px;
    }

    .preview {
      display: none;
      margin-bottom: 8px;
      position: relative;
    }

    .preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #159cff;
    }

    #removeImage {
      position: absolute;
      left: 68px;
      top: -6px;
      border: none;
      background: #ff3b3b;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 45px;
      border-radius: 13px;
      border: 1px solid #24547d;
      background: #0a2344;
      color: white;
      padding: 12px;
      outline: none;
      font-size: 14px;
    }

    textarea:focus {
      border-color: #18a9ff;
    }

    button {
      border: none;
      cursor: pointer;
    }

    #uploadBtn,
    #sendBtn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      color: white;
      font-size: 19px;
    }

    #uploadBtn {
      background: #174b78;
    }

    #sendBtn {
      background: #078bf0;
    }

    #sendBtn:disabled {
      opacity: 0.5;
    }

    #imageInput {
      display: none;
    }

    .history-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 7px;
      background: #051328;
    }

    .history-bar button {
      background: transparent;
      color: #8fdcff;
      border: 1px solid #214b72;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .history-list {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 75px;
      max-height: 300px;
      overflow-y: auto;
      background: #081c38;
      border: 1px solid #2470a8;
      border-radius: 12px;
      padding: 10px;
      z-index: 10;
    }

    .history-item {
      padding: 9px;
      margin-bottom: 6px;
      background: #102d50;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .history-item small {
      display: block;
      color: #75cfff;
      margin-top: 4px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>✦ NA MUSAMMAN AI GLOBAL</h1>
    <p>AI ASSISTANT</p>
  </header>


  <div class="history-bar">
    <button id="newChatBtn">
      New Chat
    </button>

    <button id="historyBtn">
      History
    </button>
  </div>


  <div id="historyList" class="history-list"></div>


  <main id="chat">

    <div class="welcome" id="welcome">
      <h2>NA MUSAMMAN AI GLOBAL</h2>

      <p>
        Ask anything in Hausa or English.
      </p>

      <p>
        You can also upload an image.
      </p>
    </div>

  </main>


  <div class="input-area">

    <div
      id="preview"
      class="preview"
    >
      <img
        id="previewImage"
        src=""
        alt="Selected image"
      >

      <button
        id="removeImage"
        type="button"
      >
        ×
      </button>
    </div>


    <div class="input-row">

      <button
        id="uploadBtn"
        type="button"
      >
        📎
      </button>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >


      <textarea
        id="message"
        placeholder="Type your message..."
      ></textarea>


      <button
        id="sendBtn"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

  // =========================================
  // ELEMENTS
  // =========================================

  const chat =
    document.getElementById("chat");

  const messageInput =
    document.getElementById("message");

  const sendBtn =
    document.getElementById("sendBtn");

  const uploadBtn =
    document.getElementById("uploadBtn");

  const imageInput =
    document.getElementById("imageInput");

  const preview =
    document.getElementById("preview");

  const previewImage =
    document.getElementById("previewImage");

  const removeImage =
    document.getElementById("removeImage");

  const welcome =
    document.getElementById("welcome");

  const historyBtn =
    document.getElementById("historyBtn");

  const historyList =
    document.getElementById("historyList");

  const newChatBtn =
    document.getElementById("newChatBtn");


  // =========================================
  // VARIABLES
  // =========================================

  let selectedImage = null;

  let conversation = [];

  let savedChats =
    JSON.parse(
      localStorage.getItem(
        "naMusammanHistory"
      ) || "[]"
    );


  // =========================================
  // IMAGE UPLOAD
  // =========================================

  uploadBtn.addEventListener(
    "click",
    () => {
      imageInput.click();
    }
  );


  imageInput.addEventListener(
    "change",
    () => {

      const file =
        imageInput.files[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload = (event) => {

        selectedImage =
          event.target.result;

        previewImage.src =
          selectedImage;

        preview.style.display =
          "block";
      };

      reader.readAsDataURL(file);
    }
  );


  removeImage.addEventListener(
    "click",
    () => {

      selectedImage = null;

      previewImage.src = "";

      preview.style.display =
        "none";

      imageInput.value = "";
    }
  );


  // =========================================
  // ADD MESSAGE
  // =========================================

  function addMessage(
    role,
    text,
    image = null
  ) {

    if (welcome) {
      welcome.style.display =
        "none";
    }

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      `message ${role}`;


    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";


    if (text) {

      bubble.textContent =
        text;

    }


    if (image) {

      const img =
        document.createElement(
          "img"
        );

      img.src = image;

      img.alt =
        "Uploaded image";

      bubble.appendChild(img);

    }


    wrapper.appendChild(
      bubble
    );

    chat.appendChild(
      wrapper
    );

    chat.scrollTop =
      chat.scrollHeight;
  }


  // =========================================
  // SEND MESSAGE
  // =========================================

  async function sendMessage() {

    const text =
      messageInput.value.trim();


    if (
      !text &&
      !selectedImage
    ) {
      return;
    }


    const imageToSend =
      selectedImage;


    // Keep previous history
    const previousHistory =
      conversation.slice(-10);


    // Show user message
    addMessage(
      "user",
      text,
      imageToSend
    );


    messageInput.value =
      "";


    removeImage.click();


    sendBtn.disabled =
      true;

    sendBtn.textContent =
      "…";


    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                message:
                  text,

                image:
                  imageToSend,

                history:
                  previousHistory

              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "AI connection error."
        );

      }


      const answer =
        data.answer ||
        "No answer received.";


      addMessage(
        "assistant",
        answer
      );


      // Save conversation
      conversation.push({

        role: "user",

        content:
          text ||
          "Image uploaded"

      });


      conversation.push({

        role: "assistant",

        content:
          answer

      });


      saveHistory();

      renderHistory();


    } catch (error) {

      console.error(
        "Chat error:",
        error
      );


      addMessage(
        "assistant",
        error.message ||
        "AI connection error. Please try again."
      );


    } finally {

      sendBtn.disabled =
        false;

      sendBtn.textContent =
        "➤";

    }

  }


  // =========================================
  // SEND BUTTON
  // =========================================

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  // =========================================
  // ENTER TO SEND
  // =========================================

  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  // =========================================
  // SAVE HISTORY
  // =========================================

  function saveHistory() {

    if (
      conversation.length === 0
    ) {
      return;
    }


    const firstUserMessage =
      conversation.find(
        item =>
          item.role === "user"
      );


    const title =
      firstUserMessage?.content ||
      "New Chat";


    const chatData = {

      id:
        Date.now(),

      title:
        title.substring(0, 50),

      date:
        new Date().toLocaleString(),

      messages:
        conversation

    };


    savedChats.unshift(
      chatData
    );


    // Keep only last 20 chats
    savedChats =
      savedChats.slice(0, 20);


    localStorage.setItem(
      "naMusammanHistory",
      JSON.stringify(
        savedChats
      )
    );

  }


  // =========================================
  // RENDER HISTORY
  // =========================================

  function renderHistory() {

    historyList.innerHTML =
      "";


    if (
      savedChats.length === 0
    ) {

      historyList.innerHTML =
        "<p>No chat history yet.</p>";

      return;

    }


    savedChats.forEach(
      (item) => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "history-item";


        div.innerHTML = `
          ${escapeHtml(item.title)}
          <small>
            ${escapeHtml(item.date)}
          </small>
        `;


        div.addEventListener(
          "click",
          () => {

            loadChat(
              item
            );

            historyList.style.display =
              "none";

          }
        );


        historyList.appendChild(
          div
        );

      }
    );

  }


  // =========================================
  // LOAD HISTORY
  // =========================================

  function loadChat(
    chatData
  ) {

    chat.innerHTML =
      "";

    conversation =
      [...chatData.messages];


    conversation.forEach(
      (item) => {

        addMessage(
          item.role,
          item.content
        );

      }
    );

  }


  // =========================================
  // HISTORY BUTTON
  // =========================================

  historyBtn.addEventListener(
    "click",
    () => {

      renderHistory();

      historyList.style.display =
        historyList.style.display ===
        "block"
          ? "none"
          : "block";

    }
  );


  // =========================================
  // NEW CHAT
  // =========================================

  newChatBtn.addEventListener(
    "click",
    () => {

      conversation = [];

      chat.innerHTML =
        `
        <div
          class="welcome"
          id="welcome"
        >
          <h2>
            NA MUSAMMAN AI GLOBAL
          </h2>

          <p>
            Ask anything in Hausa or English.
          </p>

          <p>
            You can also upload an image.
          </p>
        </div>
        `;

      historyList.style.display =
        "none";

    }
  );


  // =========================================
  // ESCAPE HTML
  // =========================================

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      text;

    return div.innerHTML;

  }


  // =========================================
  // INITIALIZE
  // =========================================

  renderHistory();

</script>

</body>
</html>
